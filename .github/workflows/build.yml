name: Build CRM API
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/suncoast-crm-api
          TAG: sha-${{ github.sha }}
        run: |
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
      - name: Pin Kubernetes manifests to the immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/suncoast-crm-api
          TAG: sha-${{ github.sha }}
        run: |
          perl -pi -e 's#ghcr\.io/dotcomrow/suncoast-crm-api:(?:latest|sha-[0-9a-f]+)#$ENV{IMAGE}:$ENV{TAG}#g' manifests/*.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests
          git diff --cached --quiet || git commit -m "chore: deploy ${TAG} [skip ci]"
          git push origin HEAD:prod
