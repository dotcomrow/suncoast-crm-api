apiVersion: batch/v1
kind: Job
metadata:
  name: suncoast-crm-db-migrate
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: suncoast-crm-db-migrate }
      annotations: { linkerd.io/inject: "disabled" }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/dotcomrow/suncoast-crm-api:sha-2e7484d8c99c3d2e86bc2c7b523ba64b8326eb21
          imagePullPolicy: Always
          command: ["node", "dist/migrate.js"]
          envFrom:
            - configMapRef: { name: suncoast-crm-api }
            - secretRef: { name: suncoast-crm-database }
