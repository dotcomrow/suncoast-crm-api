apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: suncoast-crm-api
  namespace: crm
spec:
  podSelector: { matchLabels: { app: suncoast-crm-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: k8s-api-gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8082 }
        # Meshed clients connect to the destination pod's Linkerd inbound proxy.
        - { protocol: TCP, port: 4143 }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: crm } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 4143 }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: linkerd-viz } }
      ports:
        # Allow Linkerd Viz Prometheus to scrape the proxy admin metrics endpoint.
        - { protocol: TCP, port: 4191 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: suncoast-crm-postgres-tunnel
  namespace: crm
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: suncoast-crm-postgres-tunnel } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
