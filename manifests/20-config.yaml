apiVersion: v1
kind: ConfigMap
metadata:
  name: suncoast-crm-api
  namespace: crm
data:
  PORT: "8080"
  EMAIL_CONFIRMATION_PORT: "8082"
  EMAIL_CONFIRMATION_PUBLIC_URL: "https://login.suncoast.systems/crm-email-confirmation/confirm-email"
  EMAIL_VERIFICATION_TTL_HOURS: "24"
  EXTERNAL_SIGNUP_EMAIL_VERIFICATION_ENABLED: "true"
  DATABASE_SSL: "false"
  CRM_TENANT_ID: "suncoast"
  CRM_PROVIDER: "espocrm"
  ESPOCRM_BASE_URL: "http://espocrm.crm.svc.cluster.local"
  # Create this custom varchar field on Contact, Account, Opportunity, and Task.
  ESPOCRM_IDEMPOTENCY_FIELD: "cSuncoastCrmId"
  KAFKA_BROKERS: "kafka.kafka.svc.internal.lan:9092"
  KAFKA_CLIENT_ID: "suncoast-crm-api"
  KAFKA_CONSUMER_GROUP: "suncoast-crm-provider-workers-v1"
  KAFKA_COMMAND_TOPIC: "crm.commands.v1"
  KAFKA_RETRY_TOPIC_1M: "crm.commands.retry.1m.v1"
  KAFKA_RETRY_TOPIC_5M: "crm.commands.retry.5m.v1"
  KAFKA_RETRY_TOPIC_30M: "crm.commands.retry.30m.v1"
  KAFKA_RETRY_TOPIC_2H: "crm.commands.retry.2h.v1"
  KAFKA_RETRY_TOPIC_6H: "crm.commands.retry.6h.v1"
  KAFKA_RETRY_TOPIC_24H: "crm.commands.retry.24h.v1"
  KAFKA_EVENT_TOPIC: "crm.events.v1"
  KAFKA_EMAIL_VALIDATION_EVENT_TOPIC: "crm.email-validation.events.v1"
  PLATFORM_NOTIFICATION_SERVICE_URL: "http://platform-notification-service.directus.svc.cluster.local:8080"
  KAFKA_DLQ_TOPIC: "crm.commands.dlq.v1"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "scram-sha-256"
  OLLAMA_ENABLED: "true"
  OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen3:14b"
  REDIS_CACHE_ENABLED: "true"
  REDIS_SENTINELS: "redis-sentinel.redis.svc.cluster.local:26379"
  REDIS_MASTER_NAME: "mymaster"
  REDIS_CACHE_TTL_SECONDS: "120"
  OPENAPI_SERVER_URL: "/crm"
  PROVIDER_MAX_ATTEMPTS: "30"
  PROCESSING_LEASE_SECONDS: "300"
  WORKER_HEALTH_PORT: "8081"
