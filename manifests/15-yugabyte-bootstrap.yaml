# Idempotent Yugabyte + Vault database-role setup. This follows the platform
# pattern used by k8s-ollama while keeping the Vault root token in namespace
# vault. Vault remains responsible for rotating the fixed application login.
apiVersion: batch/v1
kind: Job
metadata:
  name: suncoast-crm-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suncoast-crm-yugabyte-config
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: configure
          image: hashicorp/vault:1.15.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              MAINT_DB="yugabyte"
              APP_DB="suncoast_crm"
              APP_SCHEMA="crm"
              APP_LOGIN="suncoast_crm_login"
              VAULT_DB_ROLE="suncoast-crm-login"
              VAULTADMIN_USER="vaultadmin"
              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              export PGHOST PGPORT VAULT_ADDR

              apk add --no-cache postgresql15-client jq netcat-openbsd >/dev/null

              if [ -f /vault-token/VAULT_TOKEN ]; then
                VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              elif [ -f /vault-token/token ]; then
                VAULT_TOKEN="$(cat /vault-token/token)"
              else
                echo "Vault root-token file is unavailable" >&2
                exit 1
              fi
              export VAULT_TOKEN

              echo "Waiting for Yugabyte at ${PGHOST}:${PGPORT}"
              until nc -z -w2 "$PGHOST" "$PGPORT"; do sleep 3; done

              echo "Reading the Yugabyte administrator password from Vault"
              until VAULTADMIN_PASS="$(vault kv get -field=value "secret/${VAULTADMIN_USER}" 2>/dev/null)" && [ -n "$VAULTADMIN_PASS" ]; do
                sleep 3
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              DB_EXISTS="$(psql -U "$VAULTADMIN_USER" -d "$MAINT_DB" -tAc "SELECT 1 FROM pg_database WHERE datname='${APP_DB}'")"
              if [ "$DB_EXISTS" != "1" ]; then
                echo "Creating Yugabyte database ${APP_DB}"
                createdb -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$APP_DB"
              else
                echo "Yugabyte database ${APP_DB} already exists"
              fi

              psql -U "$VAULTADMIN_USER" -d "$MAINT_DB" -v ON_ERROR_STOP=1 <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${APP_LOGIN}') THEN
                  CREATE ROLE ${APP_LOGIN} LOGIN;
                END IF;
              END
              \$\$;
              GRANT ${APP_LOGIN} TO ${VAULTADMIN_USER};
              EOSQL

              psql -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 <<EOSQL
              CREATE SCHEMA IF NOT EXISTS ${APP_SCHEMA};
              ALTER SCHEMA ${APP_SCHEMA} OWNER TO ${APP_LOGIN};
              GRANT CONNECT ON DATABASE ${APP_DB} TO ${APP_LOGIN};
              GRANT USAGE, CREATE ON SCHEMA ${APP_SCHEMA} TO ${APP_LOGIN};
              ALTER ROLE ${APP_LOGIN} SET search_path = ${APP_SCHEMA}, public;

              DO \$\$
              DECLARE item RECORD;
              BEGIN
                FOR item IN
                  SELECT format('%I.%I', schemaname, tablename) AS object_name
                  FROM pg_tables WHERE schemaname = '${APP_SCHEMA}'
                LOOP
                  EXECUTE format('ALTER TABLE %s OWNER TO ${APP_LOGIN}', item.object_name);
                END LOOP;

                FOR item IN
                  SELECT format('%I.%I', sequence_schema, sequence_name) AS object_name
                  FROM information_schema.sequences WHERE sequence_schema = '${APP_SCHEMA}'
                LOOP
                  EXECUTE format('ALTER SEQUENCE %s OWNER TO ${APP_LOGIN}', item.object_name);
                END LOOP;

                FOR item IN
                  SELECT format('%I.%I', table_schema, table_name) AS object_name
                  FROM information_schema.views WHERE table_schema = '${APP_SCHEMA}'
                LOOP
                  EXECUTE format('ALTER VIEW %s OWNER TO ${APP_LOGIN}', item.object_name);
                END LOOP;
              END
              \$\$;

              ALTER DEFAULT PRIVILEGES FOR ROLE ${APP_LOGIN} IN SCHEMA ${APP_SCHEMA}
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ${APP_LOGIN};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${APP_LOGIN} IN SCHEMA ${APP_SCHEMA}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${APP_LOGIN};
              EOSQL

              echo "Registering ${APP_LOGIN} as a Vault static database role"
              jq -nc \
                --arg username "$APP_LOGIN" \
                '{db_name:"yugabyte",username:$username,rotation_statements:["ALTER ROLE \\\"{{username}}\\\" WITH PASSWORD '\''{{password}}'\''"],rotation_period:"720h"}' \
                | vault write "yugabyte-db/static-roles/${VAULT_DB_ROLE}" - >/dev/null

              vault policy write suncoast-crm-yugabyte - <<EOF
              path "yugabyte-db/static-creds/${VAULT_DB_ROLE}" {
                capabilities = ["read"]
              }
              EOF

              vault write auth/kubernetes/role/suncoast-crm-yugabyte \
                bound_service_account_names="crm-db-secret-sync" \
                bound_service_account_namespaces="crm" \
                policies="suncoast-crm-yugabyte" \
                ttl="48h" >/dev/null

              CREDS_JSON="$(vault read -format=json "yugabyte-db/static-creds/${VAULT_DB_ROLE}")"
              echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null
              echo "Yugabyte database, login, Vault role, and Kubernetes auth role are ready"
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
