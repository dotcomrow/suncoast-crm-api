# Reconcile the EspoCRM service role and API user after EspoCRM is healthy.
# The generated key is durable in Vault and is materialized for the API and
# worker by the ExternalSecret in the following sync wave.
apiVersion: batch/v1
kind: Job
metadata:
  name: suncoast-crm-espocrm-api-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suncoast-crm-espocrm-api-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.15.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache curl jq >/dev/null
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              if [ -f /vault-token/VAULT_TOKEN ]; then
                export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              elif [ -f /vault-token/token ]; then
                export VAULT_TOKEN="$(cat /vault-token/token)"
              else
                echo "Vault root-token file is unavailable" >&2
                exit 1
              fi

              ESPO_BASE="http://espocrm.crm.svc.cluster.local/api/v1"
              ADMIN_PASSWORD="$(vault kv get -field=espocrm_admin_password secret/suncoast-crm-api)"
              OIDC_CLIENT_ID="$(vault kv get -field=value secret/keycloak-client-id-espocrm)"
              OIDC_CLIENT_SECRET="$(vault kv get -field=value secret/keycloak-client-secret-espocrm)"
              test -n "$ADMIN_PASSWORD"
              test -n "$OIDC_CLIENT_ID"; test -n "$OIDC_CLIENT_SECRET"
              ADMIN_AUTH="$(printf 'admin:%s' "$ADMIN_PASSWORD" | base64 | tr -d '\n')"
              unset ADMIN_PASSWORD

              request() {
                method="$1"; path="$2"; output="$3"; payload="${4:-}"
                if [ -n "$payload" ]; then
                  status="$(curl -sS -o "$output" -w '%{http_code}' -X "$method" \
                    -H "Authorization: Basic $ADMIN_AUTH" -H 'Content-Type: application/json' \
                    --data "$payload" "$ESPO_BASE$path")"
                else
                  status="$(curl -sS -o "$output" -w '%{http_code}' -X "$method" \
                    -H "Authorization: Basic $ADMIN_AUTH" "$ESPO_BASE$path")"
                fi
                case "$status" in
                  2??) ;;
                  *) echo "EspoCRM $method $path failed with HTTP $status" >&2; cat "$output" >&2; exit 1 ;;
                esac
              }

              echo "Waiting for EspoCRM administrator API readiness"
              ready=false
              for attempt in $(seq 1 90); do
                status="$(curl -sS -o /tmp/app-user.json -w '%{http_code}' \
                  -H "Authorization: Basic $ADMIN_AUTH" "$ESPO_BASE/App/user" || true)"
                if [ "$status" = 200 ]; then ready=true; break; fi
                sleep 5
              done
              test "$ready" = true

              # The provider uses this custom field as its durable replay key.
              # EspoCRM adds the `c` prefix when creating a field on a native
              # entity, so `suncoastCrmId` becomes `cSuncoastCrmId`.
              request GET /Metadata /tmp/metadata.json
              for entity in Contact Account Opportunity Task; do
                field_type="$(jq -r --arg entity "$entity" \
                  '.entityDefs[$entity].fields.cSuncoastCrmId.type // empty' /tmp/metadata.json)"
                if [ -z "$field_type" ]; then
                  field_payload='{"name":"suncoastCrmId","label":"Suncoast CRM ID","type":"varchar","maxLength":64,"required":false,"audited":false}'
                  request POST "/Admin/fieldManager/$entity" "/tmp/field-$entity.json" "$field_payload"
                  test "$(jq -r '.type // empty' "/tmp/field-$entity.json")" = varchar
                  echo "Created cSuncoastCrmId on $entity"
                elif [ "$field_type" != varchar ]; then
                  echo "$entity.cSuncoastCrmId has unexpected type $field_type" >&2
                  exit 1
                else
                  echo "Preserving $entity.cSuncoastCrmId"
                fi
              done

              # External signup confirmation state is stored on Contact so it
              # is visible to CRM users and survives facade cache rebuilds.
              for field_spec in 'emailVerified|Email Verified|bool' 'emailVerifiedAt|Email Verified At|datetime'; do
                field_name="${field_spec%%|*}"
                field_tail="${field_spec#*|}"
                field_label="${field_tail%%|*}"
                field_type="${field_tail##*|}"
                metadata_name="c$(printf '%s' "$field_name" | cut -c1 | tr '[:lower:]' '[:upper:]')$(printf '%s' "$field_name" | cut -c2-)"
                existing_type="$(jq -r --arg name "$metadata_name" '.entityDefs.Contact.fields[$name].type // empty' /tmp/metadata.json)"
                if [ -z "$existing_type" ]; then
                  field_payload="$(jq -cn --arg name "$field_name" --arg label "$field_label" --arg type "$field_type" \
                    '{name:$name,label:$label,type:$type,required:false,audited:true}')"
                  request POST /Admin/fieldManager/Contact "/tmp/field-Contact-$field_name.json" "$field_payload"
                  test "$(jq -r '.type // empty' "/tmp/field-Contact-$field_name.json")" = "$field_type"
                  echo "Created Contact.$metadata_name"
                elif [ "$existing_type" != "$field_type" ]; then
                  echo "Contact.$metadata_name has unexpected type $existing_type" >&2
                  exit 1
                else
                  echo "Preserving Contact.$metadata_name"
                fi
              done

              request GET /Contact/layout/detail /tmp/contact-detail-layout.json
              detail_layout="$(jq -c '
                if ([.. | objects | select(.name? == "cEmailVerified")] | length) > 0 then .
                else .[0].rows += [[{"name":"cEmailVerified"},{"name":"cEmailVerifiedAt"}]] end
              ' /tmp/contact-detail-layout.json)"
              request PUT /Contact/layout/detail /tmp/contact-detail-layout-updated.json "$detail_layout"

              request GET /Contact/layout/list /tmp/contact-list-layout.json
              list_layout="$(jq -c '
                if ([.[] | select(.name? == "cEmailVerified")] | length) > 0 then .
                else . + [{"name":"cEmailVerified"}] end
              ' /tmp/contact-list-layout.json)"
              request PUT /Contact/layout/list /tmp/contact-list-layout-updated.json "$list_layout"
              echo "Reconciled Contact email-confirmation layouts"

              role_name="Suncoast CRM API"
              request GET '/Role?maxSize=200&select=id,name' /tmp/roles.json
              role_id="$(jq -r --arg name "$role_name" '.list[]? | select(.name == $name) | .id' /tmp/roles.json | head -n1)"
              role_scopes='{
                "Account":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Contact":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Opportunity":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Task":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"}
              }'

              if [ -z "$role_id" ]; then
                payload="$(jq -cn --arg name "$role_name" --argjson data "$role_scopes" \
                  '{name:$name,data:$data,assignmentPermission:"all",userPermission:"no"}')"
                request POST /Role /tmp/role.json "$payload"
                role_id="$(jq -r '.id // empty' /tmp/role.json)"
                test -n "$role_id"
                echo "Created the EspoCRM service role"
              else
                request GET "/Role/$role_id" /tmp/role.json
                payload="$(jq -c --argjson scopes "$role_scopes" \
                  '{data:((.data // {}) * $scopes),assignmentPermission:"all",userPermission:"no"}' /tmp/role.json)"
                request PUT "/Role/$role_id" /tmp/role-updated.json "$payload"
                echo "Reconciled the EspoCRM service role"
              fi

              gui_role_name="Suncoast CRM Users"
              gui_role_id="$(jq -r --arg name "$gui_role_name" '.list[]? | select(.name == $name) | .id' /tmp/roles.json | head -n1)"
              gui_scopes='{
                "Account":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Contact":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Lead":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Opportunity":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Task":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Meeting":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Call":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Case":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "Email":{"create":"yes","read":"all","edit":"all","delete":"no","stream":"all"},
                "User":{"create":"no","read":"all","edit":"no","delete":"no","stream":"no"}
              }'
              if [ -z "$gui_role_id" ]; then
                payload="$(jq -cn --arg name "$gui_role_name" --argjson data "$gui_scopes" \
                  '{name:$name,data:$data,assignmentPermission:"all",userPermission:"no"}')"
                request POST /Role /tmp/gui-role.json "$payload"
                gui_role_id="$(jq -r '.id // empty' /tmp/gui-role.json)"
                test -n "$gui_role_id"
                echo "Created the EspoCRM GUI-user role"
              else
                request GET "/Role/$gui_role_id" /tmp/gui-role.json
                payload="$(jq -c --argjson scopes "$gui_scopes" \
                  '{data:((.data // {}) * $scopes),assignmentPermission:"all",userPermission:"no"}' /tmp/gui-role.json)"
                request PUT "/Role/$gui_role_id" /tmp/gui-role-updated.json "$payload"
                echo "Reconciled the EspoCRM GUI-user role"
              fi

              request GET '/Team?maxSize=200&select=id,name' /tmp/teams.json
              access_team_name=espocrm_access
              access_team_id="$(jq -r --arg name "$access_team_name" \
                '.list[]? | select(.name == $name) | .id' /tmp/teams.json | head -n1)"
              if [ -z "$access_team_id" ]; then
                payload="$(jq -cn --arg name "$access_team_name" --arg role "$gui_role_id" \
                  '{name:$name,rolesIds:[$role]}')"
                request POST /Team /tmp/access-team.json "$payload"
                access_team_id="$(jq -r '.id // empty' /tmp/access-team.json)"
                test -n "$access_team_id"
                echo "Created the EspoCRM access team"
              else
                payload="$(jq -cn --arg role "$gui_role_id" '{rolesIds:[$role]}')"
                request PUT "/Team/$access_team_id" /tmp/access-team.json "$payload"
                echo "Reconciled the EspoCRM access team"
              fi

              admin_team_name=espocrm_admins
              admin_team_id="$(jq -r --arg name "$admin_team_name" \
                '.list[]? | select(.name == $name) | .id' /tmp/teams.json | head -n1)"
              if [ -z "$admin_team_id" ]; then
                payload="$(jq -cn --arg name "$admin_team_name" '{name:$name}')"
                request POST /Team /tmp/admin-team.json "$payload"
                admin_team_id="$(jq -r '.id // empty' /tmp/admin-team.json)"
                test -n "$admin_team_id"
                echo "Created the EspoCRM administrator team"
              fi

              user_name="suncoast-crm-api"
              request GET '/User?maxSize=200&select=id,userName,type,isActive,authMethod,rolesIds,apiKey' /tmp/users.json
              user_id="$(jq -r --arg name "$user_name" '.list[]? | select(.userName == $name and .type == "api") | .id' /tmp/users.json | head -n1)"
              user_payload="$(jq -cn --arg name "$user_name" --arg role "$role_id" \
                '{userName:$name,lastName:"Suncoast CRM API",type:"api",isActive:true,authMethod:"ApiKey",rolesIds:[$role]}')"

              if [ -z "$user_id" ]; then
                request POST /User /tmp/user.json "$user_payload"
                user_id="$(jq -r '.id // empty' /tmp/user.json)"
                api_key="$(jq -r '.apiKey // empty' /tmp/user.json)"
                echo "Created the EspoCRM API user"
              else
                request PUT "/User/$user_id" /tmp/user-updated.json "$user_payload"
                request GET "/User/$user_id" /tmp/user.json
                api_key="$(jq -r '.apiKey // empty' /tmp/user.json)"
                echo "Reconciled the EspoCRM API user"
              fi
              test -n "$user_id"; test -n "$api_key"

              status="$(curl -sS -o /tmp/api-user-check.json -w '%{http_code}' \
                -H "X-Api-Key: $api_key" "$ESPO_BASE/App/user")"
              if [ "$status" != 200 ]; then
                echo "Generated EspoCRM API-user credential failed authentication with HTTP $status" >&2
                exit 1
              fi

              vault kv patch secret/suncoast-crm-api \
                espocrm_api_key="$api_key" espocrm_api_user_id="$user_id" >/dev/null
              unset api_key

              oidc_payload="$(jq -cn \
                --arg clientId "$OIDC_CLIENT_ID" \
                --arg clientSecret "$OIDC_CLIENT_SECRET" \
                --arg baselineRoleId "$gui_role_id" \
                --arg accessTeamId "$access_team_id" \
                --arg adminTeamId "$admin_team_id" \
                --arg accessTeamName "$access_team_name" \
                --arg adminTeamName "$admin_team_name" '{
                  siteUrl:"https://espocrm.teleport.app.suncoast.systems",
                  authenticationMethod:"Oidc",
                  oidcClientId:$clientId,
                  oidcClientSecret:$clientSecret,
                  oidcAuthorizationEndpoint:"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/auth",
                  oidcTokenEndpoint:"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token",
                  oidcUserInfoEndpoint:"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/userinfo",
                  oidcJwksEndpoint:"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs",
                  oidcJwtSignatureAlgorithmList:["RS256"],
                  oidcScopes:["openid","profile","email"],
                  oidcUsernameClaim:"preferred_username",
                  oidcGroupClaim:"suncoast_roles",
                  oidcTeamsIds:[$accessTeamId,$adminTeamId],
                  oidcTeamsNames:{($accessTeamId):$accessTeamName,($adminTeamId):$adminTeamName},
                  oidcTeamsColumns:{
                    ($accessTeamId):{group:"espocrm_access"},
                    ($adminTeamId):{group:"espocrm_admins"}
                  },
                  oidcCreateUser:true,
                  oidcSync:true,
                  oidcSyncTeams:true,
                  oidcAuthorizationPkce:true,
                  oidcAuthorizationPrompt:"consent",
                  oidcFallback:true,
                  oidcAllowRegularUserFallback:false,
                  oidcAllowAdminUser:true,
                  oidcLogoutUrl:"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/logout?post_logout_redirect_uri={siteUrl}&client_id={clientId}",
                  baselineRoleId:$baselineRoleId
                }')"
              request PUT /Settings /tmp/settings.json "$oidc_payload"
              test "$(jq -r '.authenticationMethod // empty' /tmp/settings.json)" = Oidc
              unset ADMIN_AUTH OIDC_CLIENT_SECRET oidc_payload
              echo "EspoCRM API credentials and native Keycloak OIDC login are reconciled"
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
