apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-db-secret-sync
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crm-db-secret-sync
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["suncoast-crm-database"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crm-db-secret-sync
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: crm-db-secret-sync
    namespace: crm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crm-db-secret-sync
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-db-secret-sync
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  sync.sh: |
    #!/bin/sh
    set -eu

    export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
    JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login role=suncoast-crm-yugabyte jwt="$JWT")"
    export VAULT_TOKEN

    CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/suncoast-crm-login)"
    USERNAME="$(echo "$CREDS_JSON" | jq -er '.data.username')"
    PASSWORD="$(echo "$CREDS_JSON" | jq -er '.data.password')"
    USERNAME_ENC="$(printf '%s' "$USERNAME" | jq -sRr @uri)"
    PASSWORD_ENC="$(printf '%s' "$PASSWORD" | jq -sRr @uri)"
    DATABASE_URL="postgresql://${USERNAME_ENC}:${PASSWORD_ENC}@yb-tserver-service.yugabyte.svc.cluster.local:5433/suncoast_crm?options=-csearch_path%3Dcrm"

    kubectl create secret generic suncoast-crm-database \
      --namespace crm \
      --from-literal="DATABASE_URL=${DATABASE_URL}" \
      --dry-run=client \
      -o yaml | kubectl apply -f -

    echo "Yugabyte DATABASE_URL Secret synchronized from Vault static credentials"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: suncoast-crm-db-secret-initial-sync
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crm-db-secret-sync
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: crm-db-secret-sync
      restartPolicy: OnFailure
      initContainers:
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh", "-ec"]
          args: ["cp /usr/bin/kubectl /tools/kubectl && chmod +x /tools/kubectl"]
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: sync
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-ec"]
          args: ["apk add --no-cache jq >/dev/null && exec /scripts/sync.sh"]
          env:
            - name: PATH
              value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tools
              mountPath: /tools
      volumes:
        - name: script
          configMap:
            name: crm-db-secret-sync
            defaultMode: 0555
        - name: tools
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: suncoast-crm-db-secret-sync
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crm-db-secret-sync
          annotations:
            linkerd.io/inject: "disabled"
        spec:
          serviceAccountName: crm-db-secret-sync
          restartPolicy: OnFailure
          initContainers:
            - name: load-kubectl
              image: alpine/k8s:1.31.4
              command: ["sh", "-ec"]
              args: ["cp /usr/bin/kubectl /tools/kubectl && chmod +x /tools/kubectl"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: sync
              image: hashicorp/vault:1.15.4
              command: ["/bin/sh", "-ec"]
              args: ["apk add --no-cache jq >/dev/null && exec /scripts/sync.sh"]
              env:
                - name: PATH
                  value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tools
                  mountPath: /tools
          volumes:
            - name: script
              configMap:
                name: crm-db-secret-sync
                defaultMode: 0555
            - name: tools
              emptyDir: {}
