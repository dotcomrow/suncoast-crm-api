# The Kafka bootstrap Job creates the durable Kafka credential paths and this
# Kubernetes auth role without replacing existing values. The HubSpot Service
# Key remains a manual secret at secret/suncoast-crm-api.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-external-secrets
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: crm-vault
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: suncoast-crm-api
          serviceAccountRef:
            name: crm-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: suncoast-crm-api
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: crm-vault
  target:
    name: suncoast-crm-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HUBSPOT_ACCESS_TOKEN
      remoteRef: { key: suncoast-crm-api, property: value }
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: kafka-scram-user-suncoast-crm-api, property: value }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: kafka-scram-user-suncoast-crm-api-password, property: value }
