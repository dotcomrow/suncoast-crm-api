apiVersion: batch/v1
kind: Job
metadata:
  name: suncoast-crm-kafka-topic-setup
  namespace: crm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suncoast-crm-kafka-topic-setup
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: suncoast-crm-api }
          env:
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef: { name: suncoast-crm-api, key: KAFKA_SASL_USERNAME }
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef: { name: suncoast-crm-api, key: KAFKA_SASL_PASSWORD }
            - { name: KAFKA_CONNECTION_TIMEOUT_SECONDS, value: "720" }
            - { name: KAFKA_RETRY_INTERVAL_SECONDS, value: "5" }
            - { name: KAFKA_REPLICATION_FACTOR, value: "1" }
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CONFIG=/tmp/kafka-client.properties
              cat > "$CLIENT_CONFIG" <<EOF
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=SCRAM-SHA-256
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
              EOF

              deadline=$(( $(date +%s) + KAFKA_CONNECTION_TIMEOUT_SECONDS ))
              KAFKA_ACTIVE_BOOTSTRAP=""
              while [[ -z "$KAFKA_ACTIVE_BOOTSTRAP" ]]; do
                IFS=',' read -r -a servers <<< "$KAFKA_BROKERS"
                for candidate in "${servers[@]}"; do
                  candidate="$(echo "$candidate" | xargs)"
                  host="${candidate%:*}"
                  port="${candidate##*:}"
                  if [[ -n "$host" && "$host" != "$port" ]] && timeout 2 bash -lc "cat < /dev/null > /dev/tcp/${host}/${port}" 2>/dev/null; then
                    KAFKA_ACTIVE_BOOTSTRAP="$candidate"
                    break
                  fi
                done
                if (( $(date +%s) >= deadline )); then
                  echo "Timed out waiting for Kafka endpoints: ${KAFKA_BROKERS}" >&2
                  exit 1
                fi
                [[ -n "$KAFKA_ACTIVE_BOOTSTRAP" ]] || sleep "$KAFKA_RETRY_INTERVAL_SECONDS"
              done

              kafka_cli() {
                script="$1"
                shift
                "/opt/kafka/bin/${script}" --bootstrap-server "$KAFKA_ACTIVE_BOOTSTRAP" --command-config "$CLIENT_CONFIG" "$@"
              }

              auth_output=""
              until auth_output="$(kafka_cli kafka-broker-api-versions.sh 2>&1)"; do
                if (( $(date +%s) >= deadline )); then
                  echo "Timed out waiting for the central Kafka security reconciler to provision ${KAFKA_SASL_USERNAME}" >&2
                  echo "$auth_output" >&2
                  exit 1
                fi
                echo "Waiting for Kafka SCRAM principal and ACL reconciliation..."
                sleep "$KAFKA_RETRY_INTERVAL_SECONDS"
              done

              retry() {
                while ! "$@"; do
                  if (( $(date +%s) >= deadline )); then return 1; fi
                  sleep "$KAFKA_RETRY_INTERVAL_SECONDS"
                done
              }

              reconcile_topic() {
                topic="$1"
                partitions="$2"
                retention_ms="$3"
                segment_ms="$4"
                if ! kafka_cli kafka-topics.sh --describe --topic "$topic" >/dev/null 2>&1; then
                  retry kafka_cli kafka-topics.sh --create --if-not-exists \
                    --topic "$topic" --partitions "$partitions" \
                    --replication-factor "$KAFKA_REPLICATION_FACTOR"
                fi
                retry kafka_cli kafka-configs.sh --alter --entity-type topics \
                  --entity-name "$topic" \
                  --add-config "cleanup.policy=delete,retention.ms=${retention_ms},segment.ms=${segment_ms},min.insync.replicas=1"
                kafka_cli kafka-topics.sh --describe --topic "$topic"
              }

              reconcile_topic "$KAFKA_COMMAND_TOPIC" 3 604800000 3600000
              reconcile_topic "$KAFKA_EVENT_TOPIC" 3 1209600000 3600000
              reconcile_topic "$KAFKA_DLQ_TOPIC" 3 7776000000 86400000
              echo "CRM Kafka topic setup complete"
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
